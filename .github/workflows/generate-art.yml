
name: Generate LayerCraft Artwork

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Describe your artwork"
        required: true
        default: "A traditional Nativity scene"
        type: string

      layers:
        description: "Number of intended wooden layers"
        required: true
        default: "6"
        type: choice
        options:
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"

      frame:
        description: "Frame shape"
        required: true
        default: "Arch"
        type: choice
        options:
          - Arch
          - Circle
          - Heart
          - Rectangle

permissions:
  contents: read

jobs:
  generate:
    name: Generate and Validate Artwork
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install image processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace
          python3 -m pip install --break-system-packages Pillow

      - name: Generate and validate AI artwork
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DESCRIPTION: ${{ inputs.description }}
          LAYERS: ${{ inputs.layers }}
          FRAME: ${{ inputs.frame }}

        run: |
          mkdir -p artwork

          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error

          from PIL import Image, ImageOps

          folder = "artwork"

          report = {
              "status": "started",
              "laser_ready": False,
              "checks": {},
              "warnings": []
          }

          def save_report():
              with open(
                  f"{folder}/quality-report.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(report, f, indent=2)

          def fail(message):
              report["status"] = "failed"
              report["warnings"].append(message)
              save_report()
              raise RuntimeError(message)

          save_report()

          api_key = os.environ.get("OPENAI_API_KEY")

          if not api_key:
              fail("OPENAI_API_KEY is missing.")

          description = os.environ["DESCRIPTION"]
          layers = int(os.environ["LAYERS"])
          frame = os.environ["FRAME"]

          prompt = f"""
          Create professional flat black-and-white
          silhouette artwork for a laser-cut
          plywood shadow-box project.

          SUBJECT:
          {description}

          INTENDED NUMBER OF LAYERS:
          {layers}

          FRAME SHAPE:
          {frame}

          STYLE:

          Pure black silhouettes.
          Pure white background.
          Flat front-facing 2D artwork.
          Bold, continuous contours.
          Clear negative spaces.
          Large, recognisable shapes.

          The composition should have
          distinguishable foreground,
          middle-ground and background objects.

          Avoid fragile, narrow connections.

          Avoid excessive fine details.

          Keep major elements visually
          separable for later layer processing.

          Do not generate:
          - Wood textures
          - Photographs
          - Gradients
          - Shadows
          - Grey backgrounds
          - Black backgrounds
          - 3D product mockups
          - Text or labels

          IMPORTANT:

          Produce one clean master silhouette,
          not a photograph of a finished product.

          Leave generous white space around
          the outer edges of the composition.

          This is concept artwork that will
          undergo vector tracing and further
          engineering before laser cutting.
          """

          payload = {
              "model": "gpt-image-1",
              "prompt": prompt,
              "size": "1024x1024",
              "n": 1
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/images/generations",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Generating AI artwork...")

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=600
              ) as response:
                  result = json.load(response)

          except urllib.error.HTTPError as error:
              fail(
                  "Image API returned HTTP "
                  + str(error.code)
              )

          except Exception as error:
              fail(
                  "Image generation request failed: "
                  + type(error).__name__
              )

          try:
              encoded = result["data"][0]["b64_json"]
              image_bytes = base64.b64decode(encoded)

          except (KeyError, IndexError, TypeError):
              fail("No valid image returned.")

          with open(
              f"{folder}/design.png",
              "wb"
          ) as f:
              f.write(image_bytes)

          print("AI artwork generated.")

          # Convert the image to greyscale.

          image = Image.open(
              f"{folder}/design.png"
          ).convert("RGB")

          grey = ImageOps.grayscale(image)

          # Measure the original image.

          original_width, original_height = grey.size

          original_histogram = grey.histogram()

          original_bright_fraction = (
              sum(original_histogram[230:])
              / (original_width * original_height)
          )

          report["checks"][
              "original_bright_fraction"
          ] = round(original_bright_fraction, 4)

          # Reject images that are almost
          # entirely dark before processing.

          if original_bright_fraction < 0.03:
              fail(
                  "Original image is too dark "
                  "for reliable silhouette tracing."
              )

          # Convert greyscale to pure
          # black-and-white pixels.

          black_white = grey.point(
              lambda value: 0 if value < 150 else 255
          )

          # Add a guaranteed white border.
          # This prevents the white-margin
          # validation failure encountered
          # in the previous workflow.

          border_size = max(
              40,
              int(
                  min(
                      original_width,
                      original_height
                  ) * 0.08
              )
          )

          black_white = ImageOps.expand(
              black_white,
              border=border_size,
              fill=255
          )

          width, height = black_white.size

          report["checks"][
              "added_white_border_pixels"
          ] = border_size

          report["checks"][
              "processed_width"
          ] = width

          report["checks"][
              "processed_height"
          ] = height

          # Save the processed image.

          black_white.save(
              f"{folder}/black-white.png"
          )

          # Calculate the black-and-white balance.

          histogram = black_white.histogram()

          black = histogram[0]
          white = histogram[255]

          total = black + white

          black_fraction = black / total
          white_fraction = white / total

          report["checks"][
              "black_fraction"
          ] = round(black_fraction, 4)

          report["checks"][
              "white_fraction"
          ] = round(white_fraction, 4)

          print(
              "Black percentage:",
              round(black_fraction * 100, 2)
          )

          print(
              "White percentage:",
              round(white_fraction * 100, 2)
          )

          if not (
              0.03 <= black_fraction <= 0.80
          ):
              fail(
                  "Black-and-white balance failed. "
                  "Image may be too dark or too empty."
              )

          # Check that the new outer
          # border is completely white.

          pixels = black_white.load()

          margin = max(
              1,
              border_size // 2
          )

          border_total = 0
          border_white = 0

          for y in range(height):
              for x in range(width):

                  if (
                      x < margin
                      or x >= width - margin
                      or y < margin
                      or y >= height - margin
                  ):
                      border_total += 1

                      if pixels[x, y] == 255:
                          border_white += 1

          border_fraction = (
              border_white / border_total
          )

          report["checks"][
              "white_border_fraction"
          ] = round(border_fraction, 4)

          if border_fraction < 0.99:
              fail(
                  "White margin validation failed."
              )

          # Export a Potrace-compatible bitmap.

          black_white.convert("1").save(
              f"{folder}/trace.pbm"
          )

          # Save project information.

          project = {
              "description": description,
              "intended_layers": layers,
              "frame": frame,
              "master_image": "design.png",
              "processed_image": "black-white.png",
              "vector_file": "master-outline.svg",
              "laser_ready": False,
              "status": "Validated master bitmap"
          }

          with open(
              f"{folder}/project.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(project, f, indent=2)

          report["status"] = (
              "bitmap_validation_passed"
          )

          save_report()

          print("Image validation successful.")
          PY

      - name: Convert validated image to SVG
        run: |
          potrace artwork/trace.pbm \
            --svg \
            --output artwork/master-outline.svg \
            --turdsize 12 \
            --opttolerance 0.4

          test -s artwork/master-outline.svg

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          svg_path = "artwork/master-outline.svg"

          tree = ET.parse(svg_path)
          root = tree.getroot()

          namespace = (
              "{http://www.w3.org/2000/svg}"
          )

          paths = root.findall(
              f".//{namespace}path"
          )

          with open(
              "artwork/quality-report.json",
              encoding="utf-8"
          ) as f:
              report = json.load(f)

          report["checks"][
              "svg_path_count"
          ] = len(paths)

          if not paths:
              report["status"] = "failed"

              report["warnings"].append(
                  "SVG tracing produced no paths."
              )

          else:
              report["status"] = (
                  "master_svg_generated"
              )

          report["warnings"].append(
              "SVG has not been separated "
              "into individual physical layers."
          )

          report["warnings"].append(
              "Structural integrity, minimum "
              "feature sizes and cutting "
              "geometry require manual checks."
          )

          with open(
              "artwork/quality-report.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(report, f, indent=2)

          if not paths:
              raise RuntimeError(
                  "SVG contains no vector paths."
              )

          print(
              "SVG generated successfully."
          )

          print(
              "Vector path elements:",
              len(paths)
          )
          PY

      - name: Create project instructions
        run: |
          cat > artwork/README.txt <<'EOF'
          LAYERCRAFT STUDIO
          ========================

          AUTOMATIC SVG GENERATION

          INCLUDED FILES

          design.png
          Original AI-generated artwork.

          black-white.png
          Processed black-and-white artwork.

          trace.pbm
          Intermediate tracing bitmap.

          master-outline.svg
          Automatically traced SVG artwork.

          project.json
          Project settings.

          quality-report.json
          Image and SVG validation results.


          IMPORTANT

          This is a master vector design.

          It is NOT yet separated into
          individual wooden layers.

          It has NOT been fully validated
          for laser cutting.

          Before cutting:

          Check dimensions and scale.

          Check for disconnected pieces.

          Check minimum feature sizes.

          Check overlapping cutting paths.

          Confirm that every component
          has adequate structural support.

          Perform a test cut.

          Never leave the laser unattended.
          EOF

      - name: Upload artwork and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layercraft-validated-project
          path: artwork/
          retention-days: 30
          if-no-files-found: warn
