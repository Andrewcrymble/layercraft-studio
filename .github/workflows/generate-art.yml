
name: Generate LayerCraft Artwork

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Describe your artwork"
        required: true
        default: "A traditional Nativity scene"
        type: string

      layers:
        description: "Number of intended wooden layers"
        required: true
        default: "6"
        type: choice
        options:
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"

      frame:
        description: "Frame shape"
        required: true
        default: "Arch"
        type: choice
        options:
          - Arch
          - Circle
          - Heart
          - Rectangle

permissions:
  contents: read

jobs:
  generate:
    name: Generate and Validate Artwork
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install image processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace
          python3 -m pip install \
            --break-system-packages Pillow

      - name: Generate and validate AI artwork
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DESCRIPTION: ${{ inputs.description }}
          LAYERS: ${{ inputs.layers }}
          FRAME: ${{ inputs.frame }}

        run: |
          mkdir -p artwork

          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          from PIL import Image, ImageOps, ImageStat

          folder = "artwork"

          report = {
              "status": "started",
              "laser_ready": False,
              "checks": {},
              "warnings": []
          }

          def save_report():
              with open(
                  f"{folder}/quality-report.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(report, f, indent=2)

          def fail(message):
              report["status"] = "failed"
              report["warnings"].append(message)
              save_report()
              raise RuntimeError(message)

          save_report()

          api_key = os.environ.get(
              "OPENAI_API_KEY"
          )

          if not api_key:
              fail(
                  "OPENAI_API_KEY is missing."
              )

          description = os.environ[
              "DESCRIPTION"
          ]

          layers = int(
              os.environ["LAYERS"]
          )

          frame = os.environ["FRAME"]

          prompt = f"""
          Produce a CLEAN, FLAT, BLACK AND WHITE
          VECTOR-STYLE SILHOUETTE DESIGN.

          SUBJECT:
          {description}

          FRAME:
          {frame}

          INTENDED PHYSICAL LAYERS:
          {layers}

          This artwork is intended for laser
          cutting from thin plywood.

          ESSENTIAL REQUIREMENTS:

          The entire background must be PURE WHITE.

          Use solid PURE BLACK shapes only.

          The outside corners and margins of
          the image must remain pure white.

          Use thick, clearly defined outlines.

          Produce a front-facing 2D composition.

          All shapes must have clean edges.

          Use large negative spaces.

          Avoid tiny details and thin bridges.

          Clearly distinguish the foreground,
          middle-ground and background objects.

          Make the major shapes visually
          separable for later processing.

          IMPORTANT RESTRICTIONS:

          Absolutely NO wood texture.
          NO wood grain.
          NO photographic rendering.
          NO 3D mockup.
          NO shadows.
          NO gradients.
          NO grey background.
          NO coloured background.
          NO black background.
          NO decorative paper texture.
          NO text or labels.

          The result must look like a simple
          black silhouette printed on a clean
          white sheet of paper.

          Produce ONE master design.

          Do not depict an assembled wooden
          product or a finished shadow box.

          This is concept artwork that will
          undergo further vector processing.
          """

          payload = {
              "model": "gpt-image-1",
              "prompt": prompt,
              "size": "1024x1024",
              "n": 1
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/images/generations",
              data=json.dumps(
                  payload
              ).encode("utf-8"),
              headers={
                  "Authorization":
                      f"Bearer {api_key}",
                  "Content-Type":
                      "application/json"
              },
              method="POST"
          )

          print("Generating AI artwork...")

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=600
              ) as response:
                  result = json.load(response)

          except urllib.error.HTTPError as error:
              fail(
                  "Image API returned HTTP "
                  + str(error.code)
              )

          except Exception as error:
              fail(
                  "Image generation request failed: "
                  + type(error).__name__
              )

          try:
              encoded = result[
                  "data"
              ][0]["b64_json"]

              image_bytes = base64.b64decode(
                  encoded
              )

          except (KeyError, IndexError, TypeError):
              fail(
                  "No valid image returned."
              )

          with open(
              f"{folder}/design.png",
              "wb"
          ) as f:
              f.write(image_bytes)

          print("AI image saved.")

          # Prepare image for analysis.

          image = Image.open(
              f"{folder}/design.png"
          ).convert("RGB")

          grey = ImageOps.grayscale(image)

          width, height = grey.size

          # Check the original background
          # before applying any threshold.

          margin = max(
              1,
              int(min(width, height) * 0.04)
          )

          pixels = grey.load()

          border_samples = []

          for y in range(height):
              for x in range(width):
                  if (
                      x < margin
                      or x >= width - margin
                      or y < margin
                      or y >= height - margin
                  ):
                      border_samples.append(
                          pixels[x, y]
                      )

          bright_border = sum(
              1
              for value in border_samples
              if value >= 230
          ) / len(border_samples)

          report["checks"][
              "white_border_fraction"
          ] = round(
              bright_border,
              4
          )

          # Reject dark backgrounds rather
          # than accidentally tracing them.

          if bright_border < 0.90:
              fail(
                  "Background validation failed. "
                  "The original image does not "
                  "have sufficiently white margins. "
                  "Try generating another design."
              )

          # Convert to high-contrast artwork.

          black_white = grey.point(
              lambda value:
                  0 if value < 150 else 255
          )

          black_white.save(
              f"{folder}/black-white.png"
          )

          histogram = black_white.histogram()

          black = histogram[0]
          white = histogram[255]

          total = black + white

          black_fraction = black / total
          white_fraction = white / total

          report["checks"][
              "black_fraction"
          ] = round(
              black_fraction,
              4
          )

          report["checks"][
              "white_fraction"
          ] = round(
              white_fraction,
              4
          )

          print(
              "Black pixel percentage:",
              round(
                  black_fraction * 100,
                  2
              )
          )

          print(
              "White pixel percentage:",
              round(
                  white_fraction * 100,
                  2
              )
          )

          # Reject images that are almost
          # entirely black or white.

          if not (
              0.03 <= black_fraction <= 0.80
          ):
              fail(
                  "Image validation failed: "
                  "unusable black/white balance."
              )

          # Verify that white margins survived
          # the conversion process.

          bw_pixels = black_white.load()

          border_white = sum(
              1
              for y in range(height)
              for x in range(width)
              if (
                  x < margin
                  or x >= width - margin
                  or y < margin
                  or y >= height - margin
              )
              and bw_pixels[x, y] == 255
          )

          converted_border_fraction = (
              border_white / len(border_samples)
          )

          report["checks"][
              "converted_white_border_fraction"
          ] = round(
              converted_border_fraction,
              4
          )

          if converted_border_fraction < 0.95:
              fail(
                  "White margin check failed."
              )

          # Save the image in a format
          # supported by Potrace.

          black_white.convert("1").save(
              f"{folder}/trace.pbm"
          )

          project = {
              "description": description,
              "intended_layers": layers,
              "frame": frame,
              "master_image": "design.png",
              "vector_file": "master-outline.svg",
              "laser_ready": False,
              "status": "Validated bitmap only"
          }

          with open(
              f"{folder}/project.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  project,
                  f,
                  indent=2
              )

          report["status"] = (
              "bitmap_validation_passed"
          )

          save_report()

          print(
              "Image quality checks passed."
          )
          PY

      - name: Convert validated image to SVG
        run: |
          potrace artwork/trace.pbm \
            --svg \
            --output artwork/master-outline.svg \
            --turdsize 12 \
            --opttolerance 0.4

          test -s artwork/master-outline.svg

          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          svg_path = (
              "artwork/master-outline.svg"
          )

          tree = ET.parse(svg_path)
          root = tree.getroot()

          paths = root.findall(
              ".//{http://www.w3.org/2000/svg}path"
          )

          with open(
              "artwork/quality-report.json",
              encoding="utf-8"
          ) as f:
              report = json.load(f)

          report["checks"][
              "svg_path_count"
          ] = len(paths)

          if not paths:
              report["status"] = "failed"
              report["warnings"].append(
                  "SVG contains no paths."
              )
          else:
              report["status"] = (
                  "master_svg_generated"
              )

          report["warnings"].append(
              "SVG has not been separated "
              "into physical cutting layers."
          )

          report["warnings"].append(
              "Structural support, minimum "
              "feature size and duplicate "
              "cut paths have not been "
              "fully validated."
          )

          with open(
              "artwork/quality-report.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2
              )

          if not paths:
              raise RuntimeError(
                  "SVG tracing produced no paths."
              )

          print(
              "SVG generated with",
              len(paths),
              "path elements."
          )
          PY

      - name: Create cutting instructions
        if: success()
        run: |
          cat > artwork/README.txt <<'EOF'
          LAYERCRAFT STUDIO
          ========================

          AUTOMATIC SVG PROJECT

          FILES:

          design.png
          Original AI-generated artwork.

          black-white.png
          Validated black-and-white image.

          master-outline.svg
          Automatically traced SVG.

          project.json
          Project information.

          quality-report.json
          Automated quality-check results.

          IMPORTANT:

          This is a master SVG only.

          It has NOT been separated into
          individual wooden cutting layers.

          It has NOT passed full structural
          or laser-cutting validation.

          Check all geometry manually.

          Ensure that disconnected objects
          are supported.

          Verify dimensions, minimum
          feature sizes and cutting paths.

          Always perform a test cut.
          EOF

      - name: Upload artwork and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layercraft-validated-project
          path: artwork/
          retention-days: 30
          if-no-files-found: warn
