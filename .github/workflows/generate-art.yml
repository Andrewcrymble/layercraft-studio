
name: Generate LayerCraft Artwork

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Describe your artwork"
        required: true
        default: "A traditional Nativity scene"
        type: string

      layers:
        description: "Number of wooden layers"
        required: true
        default: "6"
        type: choice
        options:
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"

      frame:
        description: "Frame shape"
        required: true
        default: "Arch"
        type: choice
        options:
          - Arch
          - Circle
          - Heart
          - Rectangle

permissions:
  contents: read

jobs:
  generate:
    name: Generate Laser Artwork
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate AI silhouette
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DESCRIPTION: ${{ inputs.description }}
          LAYERS: ${{ inputs.layers }}
          FRAME: ${{ inputs.frame }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error

          api_key = os.environ.get("OPENAI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "OPENAI_API_KEY is not configured."
              )

          description = os.environ["DESCRIPTION"]
          layers = os.environ["LAYERS"]
          frame = os.environ["FRAME"]

          prompt = f"""
          Create professional black-and-white
          silhouette artwork for laser cutting.

          PROJECT:
          A multilayer plywood shadow-box design.

          SUBJECT:
          {description}

          NUMBER OF INTENDED WOODEN LAYERS:
          {layers}

          FRAME SHAPE:
          {frame}

          ARTWORK REQUIREMENTS:

          1. Use pure black silhouettes against
             a completely white background.

          2. Create clean, bold, continuous outlines
             suitable for vector tracing.

          3. Use a completely flat 2D front view.

          4. No wood grain, photographs, shadows,
             gradients, lighting effects or
             three-dimensional rendering.

          5. Create a balanced composition with
             clear foreground, middle-ground
             and background elements.

          6. Make the major objects visually
             distinguishable so they can later
             be assigned to separate layers.

          7. Use large negative spaces and
             avoid excessive fine detail.

          8. Avoid thin, fragile structures
             that would be unsuitable for
             cutting from plywood.

          9. Where practical, connect silhouettes
             to surrounding structural shapes.

          10. Do not include text, annotations,
              measurements or watermarks.

          IMPORTANT:

          This is artwork intended for subsequent
          conversion into physical laser-cut layers.

          Do not create a photograph or illustration
          of an assembled wooden product.

          Do not use perspective or mockup effects.

          Produce ONE clean, high-contrast,
          black-and-white master silhouette.

          The composition should be suitable for
          further processing into approximately
          {layers} separate plywood layers.

          This image is a design concept.
          """

          payload = {
              "model": "gpt-image-1",
              "prompt": prompt,
              "size": "1024x1024",
              "n": 1
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/images/generations",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Generating LayerCraft artwork...")

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=600
              ) as response:
                  result = json.load(response)

          except urllib.error.HTTPError as error:
              print(
                  "OpenAI API request failed:",
                  error.code
              )
              raise RuntimeError(
                  "Image generation failed."
              ) from error

          image_data = result["data"][0]["b64_json"]
          image_bytes = base64.b64decode(image_data)

          os.makedirs("artwork", exist_ok=True)

          output_path = "artwork/design.png"

          with open(output_path, "wb") as output:
              output.write(image_bytes)

          project_info = {
              "description": description,
              "intended_layers": int(layers),
              "frame": frame,
              "image": "design.png",
              "status": "Concept artwork",
              "laser_ready": False
          }

          with open(
              "artwork/project.json",
              "w",
              encoding="utf-8"
          ) as output:
              json.dump(
                  project_info,
                  output,
                  indent=2
              )

          print("Artwork successfully generated.")
          print("Saved:", output_path)
          print("Intended layers:", layers)
          print("Frame:", frame)
          PY

      - name: Upload LayerCraft artwork
        uses: actions/upload-artifact@v4
        with:
          name: layercraft-artwork
          path: artwork/
          retention-days: 30
          if-no-files-found: error
