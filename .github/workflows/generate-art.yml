
name: Generate LayerCraft Artwork

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Describe your artwork"
        required: true
        default: "A traditional Nativity scene"
        type: string

      layers:
        description: "Number of intended wooden layers"
        required: true
        default: "6"
        type: choice
        options:
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"

      frame:
        description: "Frame shape"
        required: true
        default: "Arch"
        type: choice
        options:
          - Arch
          - Circle
          - Heart
          - Rectangle

permissions:
  contents: read

jobs:
  generate:
    name: Generate Laser Artwork
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace
          python3 -m pip install --break-system-packages Pillow

      - name: Generate AI silhouette
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DESCRIPTION: ${{ inputs.description }}
          LAYERS: ${{ inputs.layers }}
          FRAME: ${{ inputs.frame }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error

          api_key = os.environ.get("OPENAI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "OPENAI_API_KEY is not configured."
              )

          description = os.environ["DESCRIPTION"]
          layers = os.environ["LAYERS"]
          frame = os.environ["FRAME"]

          prompt = f"""
          Create professional black-and-white
          silhouette artwork intended for
          laser-cut plywood shadow boxes.

          SUBJECT:
          {description}

          INTENDED NUMBER OF LAYERS:
          {layers}

          FRAME:
          {frame}

          STRICT ARTWORK REQUIREMENTS:

          - Pure black shapes on a white background.
          - Flat 2D artwork viewed directly from front.
          - Bold, clean, continuous contours.
          - No photographs or wood textures.
          - No gradients, shadows or 3D rendering.
          - No grey shading or halftone patterns.
          - No text, labels or measurements.
          - Avoid tiny decorative details.
          - Avoid narrow or fragile connections.
          - Use clearly distinguishable objects.
          - Maintain a balanced composition.
          - Include a recognisable outer frame.
          - Use strong positive and negative spaces.

          COMPOSITION:

          Arrange the scene so the major objects
          could subsequently be assigned to
          foreground, middle-ground and
          background plywood layers.

          Avoid unnecessary overlapping objects.

          Ensure that major silhouettes have
          plausible structural connections.

          IMPORTANT:

          Produce ONE clean master silhouette.

          Do not create a photograph of an
          assembled wooden product.

          This is a master design concept,
          not an already-separated cutting file.
          """

          payload = {
              "model": "gpt-image-1",
              "prompt": prompt,
              "size": "1024x1024",
              "n": 1
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/images/generations",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Generating AI artwork...")

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=600
              ) as response:
                  result = json.load(response)

          except urllib.error.HTTPError as error:
              print(
                  "Image generation failed.",
                  "HTTP status:",
                  error.code
              )
              raise RuntimeError(
                  "OpenAI image generation failed."
              ) from error

          image_data = result["data"][0]["b64_json"]
          image_bytes = base64.b64decode(image_data)

          os.makedirs("artwork", exist_ok=True)

          with open(
              "artwork/design.png",
              "wb"
          ) as output:
              output.write(image_bytes)

          project = {
              "description": description,
              "intended_layers": int(layers),
              "frame": frame,
              "source_image": "design.png",
              "vector_image": "master-outline.svg",
              "laser_ready": False,
              "status": "Unvalidated master artwork"
          }

          with open(
              "artwork/project.json",
              "w",
              encoding="utf-8"
          ) as output:
              json.dump(project, output, indent=2)

          print("AI image generated successfully.")
          PY

      - name: Convert image to black and white
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps

          image = Image.open(
              "artwork/design.png"
          ).convert("RGB")

          # Convert to greyscale.
          grey = ImageOps.grayscale(image)

          # Remove intermediate tones.
          black_white = grey.point(
              lambda value: 0 if value < 128 else 255
          )

          black_white.save(
              "artwork/black-white.png"
          )

          # Potrace accepts portable bitmap files.
          black_white.convert("1").save(
              "artwork/trace.pbm"
          )

          print(
              "Black-and-white image prepared."
          )
          PY

      - name: Trace image into SVG
        run: |
          potrace artwork/trace.pbm \
            --svg \
            --output artwork/master-outline.svg \
            --turdsize 12 \
            --opttolerance 0.4

          test -s artwork/master-outline.svg

          echo "SVG tracing completed."

      - name: Create project instructions
        run: |
          cat > artwork/README.txt <<'EOF'
          LAYERCRAFT STUDIO
          =================

          AI ARTWORK AND VECTOR TRACING

          INCLUDED FILES

          design.png
          Original AI-generated artwork.

          black-white.png
          Simplified black-and-white artwork.

          trace.pbm
          Intermediate bitmap used for tracing.

          master-outline.svg
          Automatically traced vector outlines.

          project.json
          Project description and settings.


          IMPORTANT SAFETY INFORMATION

          The SVG is automatically traced artwork.

          It is NOT yet a verified laser-cut design.

          The intended number of layers is recorded
          in project.json, but the artwork has not
          been separated into physical depth layers.

          Inspect all paths before laser cutting.

          Check for:

          - Disconnected or floating elements.
          - Extremely thin connections.
          - Duplicate or overlapping cut lines.
          - Small internal pieces that may fall out.
          - Correct dimensions and scaling.
          - Suitable structural support.

          Adjust the design in your vector editor
          before importing it into your laser software.

          Never leave your laser unattended.
          EOF

      - name: Upload complete LayerCraft project
        uses: actions/upload-artifact@v4
        with:
          name: layercraft-svg-project
          path: artwork/
          retention-days: 30
          if-no-files-found: error
